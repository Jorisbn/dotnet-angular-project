services:
    postgres:
        image: postgres:18
        container_name: invoice-flow-postgres
        restart: unless-stopped

        environment:
            POSTGRES_DB: invoiceflow
            POSTGRES_USER: invoiceflow
            POSTGRES_PASSWORD: invoiceflow_dev

        ports:
            - "15432:5432"

        volumes:
            - postgres_data:/var/lib/postgresql

volumes:
    postgres_data:
