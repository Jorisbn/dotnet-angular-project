<div class="w-[min(calc(100% - 32px), 400px)] m-[80px auto] p-8 border border-[#ddd] rounded-xl">
  <h1>Sign in</h1>
  <p>Enter your credentials to continue.</p>

  <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
    <div class="flex flex-col gap-2 mx-5">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" autocomplete="username" placeholder="you@example.com" class="p-3 border border-[#ccc] rounded-md" />

      @if (forgotForm.controls.email.touched && forgotForm.controls.email.invalid) {
        <small class="text-[#c62828]"> Enter a valid email address. </small>
      }
    </div>

    @if (errorMessage) {
      <p class="text-[#c62828]" role="alert">{{ errorMessage }}</p>
    }

    <button type="submit" [disabled]="isLoading" class="w-full p-3 border-none rounded-md bg-[#2563eb] text-white cursor-pointer disabled:opacity-60 disabled:cursor-wait">
      {{ isLoading ? 'Signing in...' : 'Sign in' }}
    </button>
  </form>
</div>
